<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (64x64 centered at x=40, y=40) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="18" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
    <!-- Outer Speed Gauge Arc -->
    <path d="M 16 46 A 22 22 0 1 1 50 46" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 16 46 A 22 22 0 1 1 42 18" fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" filter="url(#logoGlow)"/>
    
    <!-- Central Maintenance Emblem -->
    <g transform="translate(32, 35) rotate(-45)">
      <path d="M -4 -16 L 4 -16 L 5 -9 L 9 -6 L 15 -6 L 15 6 L 9 6 L 5 9 L 4 16 L -4 16 L -5 9 L -9 6 L -15 6 L -15 -6 L -9 -6 L -5 -9 Z" fill="url(#logoGrad)"/>
      <circle cx="0" cy="0" r="4.5" fill="#0B1120" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    <!-- Pointer Needle -->
    <polygon points="32,35 30.5,17 32,15 33.5,17" fill="#FFFFFF"/>
    <circle cx="32" cy="35" r="3.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Typography: OtoKeep -->
  <g transform="translate(86, 44)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Oto</tspan><tspan fill="url(#logoGrad)">Keep</tspan>
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(88, 62)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="2" text-transform="uppercase">
      SMART VEHICLE TRACKER
    </text>
    <!-- Live dot badge -->
    <circle cx="152" cy="-3" r="2.5" fill="#10B981"/>
  </g>
</svg>
