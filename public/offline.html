<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - Otokeep</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #F8FAFC;
            color: #1E293B;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #FFFFFF;
            max-width: 440px;
            width: 100%;
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid #E2E8F0;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #EFF6FF;
            color: #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            line-height: 1.6;
            color: #64748B;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #1D4ED8;
            transform: translateY(-1px);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #94A3B8;
            margin-top: 18px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>
            Koneksi internet Anda terputus. Pastikan WiFi atau data seluler Anda aktif, lalu muat ulang halaman ini.
        </p>
        <button class="btn" onclick="window.location.reload()">
            🔄 Muat Ulang Halaman
        </button>
        <div class="status-badge">
            <span class="dot"></span> Otokeep Offline Mode Active
        </div>
    </div>
</body>
</html>
